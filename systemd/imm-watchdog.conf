# Installed as /etc/systemd/system.conf.d/imm-watchdog.conf by deploy_services.sh.
#
# systemd pets the Raspberry Pi's hardware watchdog (bcm2835-wdt, 15 s maximum). If the
# kernel or systemd itself hangs, the watchdog resets the Pi and the IMM-OS services
# come back on their own. A reboot that hangs is forced after RebootWatchdogSec.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
