; IMM-OS MQ-7 controller — build and flash with PlatformIO:
;   pio run -d firmware/stm32-mq7                     # build
;   pio run -d firmware/stm32-mq7 -t upload           # flash via ST-Link (SWDIO/SWCLK/GND/3.3V)
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
