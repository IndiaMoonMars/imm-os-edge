; IMM-OS ESP32 sensor board — build and flash with PlatformIO:
;   pio run -d firmware/esp32-sensors -t upload        # board on USB; picks the port itself
;   pio device monitor -b 115200                       # watch the JSON lines (Ctrl+C to quit)
[env:esp32dev]
platform = espressif32
board = esp32dev                ; 30-pin ESP32 DevKit (ESP32-WROOM-32)
framework = arduino
monitor_speed = 115200
; MQ4_DIVIDER = (R_top + R_bottom) / R_bottom of the resistor divider between the MQ-4's AO
; and GPIO32. 10 kΩ top / 20 kΩ bottom → 1.5. Change it here if your resistors differ.
build_flags = -DMQ4_DIVIDER=1.5f
