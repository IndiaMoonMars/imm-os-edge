; IMM-OS external sensor board (GNSS TEL0157 + Geiger SEN0463) — build and flash with PlatformIO:
;   pio run -d firmware/esp32-external -t upload        # board on USB
;   pio device monitor -b 115200
; Wi-Fi is not in this file: send  WIFI_SSID <name>  then  WIFI_PASS <password>  over USB once (flash).
[env:esp32dev]
platform = espressif32
board = esp32dev                ; 30-pin ESP32 DevKit (ESP32-WROOM-32)
framework = arduino
monitor_speed = 115200
; Upload at 115200: the default 460800 fails on long or thin USB cables and some CP2102 boards
; ("Unable to verify flash chip connection (No serial data received)"). About 80 s per flash.
upload_speed = 115200
